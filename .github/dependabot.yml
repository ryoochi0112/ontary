# Replaces renovate.json (removed 2026-09-07): the Renovate app was never
# installed on this repository, so that config had been silently dead.
# Nothing is automerged. A lockfile rewrite is read by a human before it lands
# on main; uv.lock stays the single source of truth for pinned versions.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week after a release before proposing it: a compromised release is
    # usually yanked within days. With the weekly schedule, a bump can lag a
    # release by up to ~14 days; that is the intended trade-off.
    cooldown:
      default-days: 7
    groups:
      # One PR for every minor and patch bump. Majors match no group, so each
      # opens its own PR and gets read on its own.
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # mcp 2.x drops the `mcp.server.fastmcp` and auth-module layout that
      # src/ontary/mcp_server.py imports (see the `<2` rationale above `mcp = [...]`
      # in pyproject.toml). Moving to 2.x is a migration with its own spec, not a
      # dependency bump; until then a 2.x PR would only ever be red (PR #10).
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      # Actions are SHA-pinned with a `# vX.Y.Z` comment; Dependabot bumps the
      # SHA and rewrites the comment in the same PR.
      actions:
        patterns: ["*"]
