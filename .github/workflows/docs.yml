name: docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Never cancel: a Pages deploy interrupted mid-flight is worse than a stale run.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs on every PR too, so a broken link or a missing nav page blocks the
  # merge instead of breaking the live site.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the docs group
        run: uv sync --group docs
      - name: Build the site (strict)
        run: make docs-build
      - name: Upload the site as the Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
