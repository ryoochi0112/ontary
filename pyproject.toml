[project]
name = "ontary"
version = "0.12.0"
description = "Domain-agnostic ontology SDK — declare a Foundry-style ontology (typed objects, links, actions, functions) and get a governed runtime"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["ontology", "governance", "audit", "mcp", "pydantic", "sdk"]
# MIT, copyright Ryo Ochi. `ontary` is the public continuation of `ontos`,
# which Atrae, Inc. authored as employee work and released to the author on
# 2026-09-06 for open-source development under this license.
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
]

[project.urls]
Repository = "https://github.com/ryoochi0112/ontary"
Changelog = "https://github.com/ryoochi0112/ontary/blob/main/CHANGELOG.md"
Documentation = "https://ryoochi0112.github.io/ontary/"
License = "https://github.com/ryoochi0112/ontary/blob/main/LICENSE"

[project.optional-dependencies]
mcp = [
    # mcp 2.x ships `mcp.server.fastmcp` only as a raising stub, so `<2`-era imports
    # fail. `stateless_http`, `json_response`, and `transport_security` moved from the
    # constructor to `run()`/`streamable_http_app()`; 2.x runs sync `def` tool handlers
    # on a worker thread, hence the `async def` handlers in `mcp_server.py`.
    # 2.1.1 is the first 2.x release verified against the full suite: `make verify`
    # is green on 2.1.1; `<3` guards the next layout change.
    "mcp>=2.1.1,<3",
]
postgres = [
    # psycopg 3. `[binary]` so an adopter does not need libpq headers to install
    # it; a deployment that prefers the system libpq can depend on plain
    # `psycopg` instead.
    "psycopg[binary]>=3.1,<4",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "ontary[mcp]",
    "ontary[postgres]",
]

[project.scripts]
ontary = "ontary.cli:main"
ontary-mcp = "ontary.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ontary"]

# Resolve against public PyPI, pinned HERE rather than left to each machine's
# `~/.config/uv/uv.toml`. A machine-local default index (a corporate proxy, a
# mirror) would otherwise rewrite every source URL in `uv.lock` on the next
# `uv run`, and that rewrite would land in a PR under a title that reads like a
# routine bump. The lockfile must describe the same index for every contributor.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Explicit so the set is stable across ruff releases: ruff 0.16.0 widened
# the implicit defaults from 59 to 413 rules, which `extend-select` composes on.
# E4/E7/E9/F is the pre-0.16 default; I/B/C901 are the project additions.
select = ["E4", "E7", "E9", "F", "I", "B", "C901"]

[tool.ruff.lint.mccabe]
# Ceiling set post-refactor (the former hotspots are decomposed).
max-complexity = 16

[tool.ruff.lint.per-file-ignores]
# B017: blind `pytest.raises(Exception)` is deliberate where only "it refuses"
# is the contract; B018: bare `ontology.definition` triggers the freeze side
# effect on purpose.
"tests/*" = ["B017", "B018"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
# The Makefile's `make typecheck` passes explicit paths (src, examples, scripts,
# and the two admitted test files); `packages` covers plain `uv run mypy` too.
packages = ["ontary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[dependency-groups]
docs = [
    "mkdocs-material==9.7.7",
    "mkdocs-static-i18n==1.3.1",
]
