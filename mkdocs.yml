site_name: ontary
site_description: The ontology SDK — author an ontology and get a governed runtime.
site_url: https://ryoochi0112.github.io/ontary/
repo_url: https://github.com/ryoochi0112/ontary
repo_name: ryoochi0112/ontary
edit_uri: blob/main/docs/
docs_dir: docs
strict: true

# The hook relaxes anchors for JA: English fallback pages link English hub headings.
validation:
  anchors: warn

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

markdown_extensions:
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - tables
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ja
          name: 日本語
          build: true
          nav_translations:
            Tutorials: チュートリアル
            How-to guides: ハウツーガイド
            Reference: リファレンス
            Explanation: 解説
            Project: プロジェクト

hooks:
  - scripts/mkdocs_hooks.py

nav:
  - Home: index.md
  - Tutorials:
      - Getting started: getting-started.md
      - Model a leave-request approval: tutorial-leave-requests.md
  - How-to guides:
      - Testing your ontology: testing.md
      - Storage, tenancy, and schema: storage.md
      - MCP serving: mcp-serving.md
  - Reference:
      - API reference: api-reference.md
      - Authoring: api-authoring.md
      - Actions & Functions: api-actions-functions.md
      - Stores & ingest: api-stores.md
      - Error codes: api-errors.md
      - CLI reference: cli.md
      - Compatibility: compatibility.md
  - Explanation:
      - Ontology design: ontology-design.md
      - Coming from DDD: coming-from-ddd.md
  - Project:
      - Roadmap: roadmap.md
      - Changelog: changelog.md
      - Releasing: releasing.md
